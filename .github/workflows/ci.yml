name: CI
on:
push:
  branches: [master, main, develop]
pull_request:
  branches: [master, main, develop]
permissions:
  contents: read
jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend
      - run: cd backend && python -m pytest tests/test_pricing_domain.py -q
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env: { POSTGRES_DB: erp_test, POSTGRES_USER: erp, POSTGRES_PASSWORD: erp_test_only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.10.2-alpine3.23
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "1"
      DB_NAME: erp_test
      DB_USER: erp
      DB_PASSWORD: erp_test_only
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: python -m pip install -r backend/requirements.txt
      - run: cd backend && python manage.py check
      - run: cd backend && python manage.py makemigrations --check --dry-run
      - run: cd backend && python manage.py migrate --noinput
      - run: cd backend && python -m pytest tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.22.1" }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
