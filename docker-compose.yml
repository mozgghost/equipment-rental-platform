name: equipment-rental-platform
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-equipment_rental}
      POSTGRES_USER: ${DB_USER:-equipment_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-equipment_app} -d ${DB_NAME:-equipment_rental}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]
  redis:
    image: redis:8.10.2-alpine3.23
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [private]
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env]
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,nginx
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost:8000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    ports: ["8001:8000"]
    volumes: ["./backend:/app"]
    restart: unless-stopped
    networks: [private]
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file: [.env]
    environment: { DB_HOST: postgres, REDIS_URL: redis://redis:6379/0 }
    depends_on:
      backend: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./backend:/app"]
    restart: unless-stopped
    networks: [private]
  beat:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    env_file: [.env]
    environment: { DB_HOST: postgres, REDIS_URL: redis://redis:6379/0 }
    depends_on:
      backend: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./backend:/app"]
    restart: unless-stopped
    networks: [private]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Equipment Rental Platform}
    restart: unless-stopped
    networks: [private]
  nginx:
    image: nginx:1.29-alpine
    ports: ["8080:80"]
    volumes: ["./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [backend, frontend]
    restart: unless-stopped
    networks: [private]
volumes:
  postgres_data:
  redis_data:
networks:
  private:
    driver: bridge
