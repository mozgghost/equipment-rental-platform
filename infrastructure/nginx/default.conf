server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s; proxy_read_timeout 45s;
    }
    location = /healthz { proxy_pass http://backend:8000/healthz; }
    location = /readyz { proxy_pass http://backend:8000/readyz; }
    location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
}
